<!doctype html>
<html lang="{{@lang}}">
<head>
<meta charset="utf-8">
<!-- lovearound.web.app and lovearound.firebaseapp.com serve this same site: send them to the real address. -->
<script>if (/\.(web\.app|firebaseapp\.com)$/.test(location.hostname)) location.replace('https://lovearound.me' + location.pathname + location.search + location.hash);</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{signin.title}}</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="/heart.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<!--
  Google sign-in for the apps. The app opens /signin/?state=<random>&key=<its
  one-time public key>; this page signs in with the Firebase JS SDK, seals
  the session (uid, email, refresh token) to that key and hands it back as
  lovearound://signin?state=…&epk=…&box=…, then signs the browser out. Only
  the app that opened the page can open the box: the link itself is useless
  to whoever sees it (the process list, the browser's history, another app
  that registered the scheme). The app accepts only the state it generated.

  The box: ECDH P-256 between the app's key and a fresh key of this page
  (epk, the raw uncompressed point), HKDF-SHA256 (no salt, info
  "lovearound signin v1") → AES-256-GCM key, the state as associated data;
  box = 12-byte nonce + ciphertext + tag. Base64url without padding.

  Builds older than the key open the page without key=; they know only the
  codename's scheme, so they get needed://signin?state=…&uid=…&email=…&rt=…
  in the clear, as before. Drop that branch once those builds have updated.

  The Telegram bot opens /signin?telegram=1, with nothing about the chat: this
  page gets a one-time link from the server with the Firebase ID token and
  goes there, and whichever Telegram opens it joins this account. Nothing
  comes from the chat, so a link from someone else's can't sign a stranger's
  account in to it.
-->
<div class="page">
<header class="top"><div class="wrap"><a class="logo" href="/"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.3-9C1.4 8.6 3.6 5 7.2 5c2.1 0 3.5 1.1 4.8 2.9C13.3 6.1 14.7 5 16.8 5c3.6 0 5.8 3.6 4.5 7-1.8 4.4-9.3 9-9.3 9z"/></svg>lovearound</a></div></header>
<main>
  <div class="card">
    <div class="badge"><svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.3-9C1.4 8.6 3.6 5 7.2 5c2.1 0 3.5 1.1 4.8 2.9C13.3 6.1 14.7 5 16.8 5c3.6 0 5.8 3.6 4.5 7-1.8 4.4-9.3 9-9.3 9z"/></svg></div>
    <h1 id="title" data-t="heading"></h1>
    <p class="lead" id="text" data-t="text"></p>
    <button class="btn" id="go" type="button" data-t="button"></button>
    <button class="btn ghost" id="mail" type="button" data-t="email_button" hidden></button>
    <form class="signin-form" id="form" novalidate hidden>
      <label><span data-t="email"></span><input id="email" type="email" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false"></label>
      <label><span data-t="password"></span><input id="password" type="password" autocomplete="current-password"></label>
      <button class="btn" id="submit" type="submit" data-t="submit"></button>
      <div class="links"><button type="button" id="formback" data-t="form_back"></button><button type="button" id="forgot" data-t="forgot"></button></div>
    </form>
    <p class="form-msg" id="note" role="status" hidden></p>
    <a class="btn" id="back" href="#" data-t="back" hidden></a>
  </div>
</main>
<footer>
  <div class="wrap">
    <span class="motto">SPREAD LOVE. FEEL CONNECTED.</span>
    <span><a href="https://github.com/lovearound-me">GitHub</a> · <a href="https://t.me/lovearound_help">Telegram</a> · © 2026 lovearound</span>
  </div>
</footer>
</div>
<script src="/lang.js"></script>
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, inMemoryPersistence, setPersistence,
    signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail }
    from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

  const app = initializeApp({
    apiKey: 'AIzaSyBZJfln_KXsxRxo3fvVaV1ePmiVUIn5YXY',
    // Sign in through the page's own host (Firebase Hosting serves /__/auth
    // there): Google then says "continue to lovearound.me", and browsers that
    // partition storage keep the sign-in state.
    authDomain: ['lovearound.me', 'www.lovearound.me'].includes(location.hostname)
      ? location.hostname : 'needed-app-2026.firebaseapp.com',
    projectId: 'needed-app-2026',
  });
  const auth = getAuth(app);
  const params = new URLSearchParams(location.search);
  const state = params.get('state') || '';
  const key = params.get('key') || '';
  const $ = (id) => document.getElementById(id);
  const T = lovearoundLang.apply({{@strings}});
  const telegram = params.get('telegram') === '1';

  const b64url = (bytes) => btoa(String.fromCharCode(...new Uint8Array(bytes)))
    .replaceAll('+', '-').replaceAll('/', '_').replace(/=+$/, '');
  const unb64url = (text) => Uint8Array.from(
    atob(text.replaceAll('-', '+').replaceAll('_', '/')), (c) => c.charCodeAt(0));

  // The session sealed to the app's key: see the comment at the top.
  async function seal(session) {
    const ecdh = { name: 'ECDH', namedCurve: 'P-256' };
    const theirs = await crypto.subtle.importKey('raw', unb64url(key), ecdh, false, []);
    const mine = await crypto.subtle.generateKey(ecdh, true, ['deriveBits']);
    const shared = await crypto.subtle.deriveBits({ name: 'ECDH', public: theirs }, mine.privateKey, 256);
    const hkdf = await crypto.subtle.importKey('raw', shared, 'HKDF', false, ['deriveKey']);
    const aes = await crypto.subtle.deriveKey(
      { name: 'HKDF', hash: 'SHA-256', salt: new Uint8Array(0), info: new TextEncoder().encode('lovearound signin v1') },
      hkdf, { name: 'AES-GCM', length: 256 }, false, ['encrypt']);
    const nonce = crypto.getRandomValues(new Uint8Array(12));
    const sealed = await crypto.subtle.encrypt(
      { name: 'AES-GCM', iv: nonce, additionalData: new TextEncoder().encode(state) },
      aes, new TextEncoder().encode(JSON.stringify(session)));
    const box = new Uint8Array(12 + sealed.byteLength);
    box.set(nonce);
    box.set(new Uint8Array(sealed), 12);
    return { epk: b64url(await crypto.subtle.exportKey('raw', mine.publicKey)), box: b64url(box) };
  }

  // Where a sign-in for the Telegram bot goes next: see the comment at the top.
  async function telegramLink(user) {
    const resp = await fetch('https://api.lovearound.me/v1/telegram/link', {
      method: 'POST',
      headers: { authorization: 'Bearer ' + await user.getIdToken() },
    });
    if (!resp.ok) throw new Error('telegram link: ' + resp.status);
    return (await resp.json()).url;
  }

  if (telegram) {
    // The bot has no accounts of its own: a new person makes one here, with
    // Google or with an email and a password, as in the web app.
    $('title').textContent = T.hello;
    $('text').textContent = T.telegram_text;
    $('back').textContent = T.telegram_back;
    $('mail').hidden = false;
    $('password').placeholder = T.password_hint;
  } else if (!/^[A-Za-z0-9-]{8,64}$/.test(state) || (key && !/^[A-Za-z0-9_-]{87}$/.test(key))) {
    $('title').textContent = T.from_app;
    $('text').textContent = T.from_app_text;
    $('go').hidden = true;
  }

  // Signed in: hand the session over (see the comment at the top).
  async function finish(user) {
    const session = { uid: user.uid, email: user.email || '', rt: user.refreshToken };
    const back = telegram
      ? await telegramLink(user)
      : key
      ? 'lovearound://signin?' + new URLSearchParams({ state, ...await seal(session) })
      : 'needed://signin?' + new URLSearchParams({ state, ...session });
    await signOut(auth);
    $('title').textContent = T.done;
    $('text').textContent = telegram ? T.telegram_done : T.done_text;
    $('text').hidden = false;
    $('go').hidden = $('mail').hidden = $('form').hidden = $('note').hidden = true;
    $('back').href = back;
    $('back').hidden = false;
    location.href = back;
  }

  // The browser keeps nothing: the session goes to the app only.
  const ready = setPersistence(auth, inMemoryPersistence);

  $('go').addEventListener('click', async () => {
    $('go').disabled = true;
    try {
      await ready;
      const { user } = await signInWithPopup(auth, new GoogleAuthProvider());
      await finish(user);
    } catch (e) {
      $('go').disabled = false;
      $('text').textContent = e && e.code === 'auth/popup-closed-by-user'
        ? T.closed
        : T.failed;
    }
  });

  // Email and password, Telegram only (the apps have their own form). As in
  // the web app: sign in, or make the account if this email has none.
  const note = (text) => { $('note').textContent = text || ''; $('note').hidden = !text; };
  const showForm = (on) => {
    $('go').hidden = $('mail').hidden = on;
    $('form').hidden = !on;
    $('text').hidden = on;
    note('');
    if (on) $('email').focus();
  };
  function authText(e) {
    switch (String(e && e.code || '').replace(/^auth\//, '')) {
      case 'wrong-password': case 'invalid-credential': case 'invalid-login-credentials': return T.wrong_password;
      case 'weak-password': return T.weak_password;
      case 'invalid-email': case 'missing-email': return T.bad_email;
      case 'missing-password': return T.need_password;
      case 'too-many-requests': return T.too_many;
      case 'user-disabled': return T.disabled;
      case 'network-request-failed': return T.offline;
      default: return T.failed;
    }
  }
  async function withEmail(email, password) {
    try {
      return (await signInWithEmailAndPassword(auth, email, password)).user;
    } catch (e) {
      // With email enumeration protection on, a wrong password and a missing
      // account look the same: try to make it.
      if (!['auth/user-not-found', 'auth/invalid-credential', 'auth/invalid-login-credentials'].includes(e.code)) throw e;
      try {
        return (await createUserWithEmailAndPassword(auth, email, password)).user;
      } catch (made) {
        // The account is there, so it was the password.
        throw made.code === 'auth/email-already-in-use' ? Object.assign(new Error(), { code: 'auth/wrong-password' }) : made;
      }
    }
  }

  $('mail').addEventListener('click', () => showForm(true));
  $('formback').addEventListener('click', () => showForm(false));
  $('form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const email = $('email').value.trim(), password = $('password').value;
    if (!email) return note(T.need_email);
    if (!email.includes('@')) return note(T.bad_email);
    if (password.length < 8) return note(T.short_password);
    note('');
    $('submit').disabled = true;
    $('submit').textContent = T.busy;
    try {
      await ready;
      await finish(await withEmail(email, password));
    } catch (e) {
      note(authText(e));
    } finally {
      $('submit').disabled = false;
      $('submit').textContent = T.submit;
    }
  });
  $('forgot').addEventListener('click', async () => {
    const email = $('email').value.trim();
    if (!email) return note(T.reset_first);
    try {
      await sendPasswordResetEmail(auth, email);
      note(T.reset_sent);
    } catch (e) {
      note(authText(e));
    }
  });
</script>
</body>
</html>
