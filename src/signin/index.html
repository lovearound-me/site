<!doctype html>
<html lang="{{@lang}}">
<head>
<meta charset="utf-8">
<!-- lovearound.web.app and lovearound.firebaseapp.com serve this same site: send them to the real address. -->
<script>if (/\.(web\.app|firebaseapp\.com)$/.test(location.hostname)) location.replace('https://lovearound.me' + location.pathname + location.search + location.hash);</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{signin.title}}</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="/heart.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<!--
  Sign-in for the apps (Apple, Google or email), at /login and, for the apps
  already out, at /signin: the same page. The app opens /signin/?state=<random>&key=<its
  one-time public key>; this page signs in with the Firebase JS SDK, seals
  the session (uid, email, refresh token) to that key and hands it back as
  lovearound://signin?state=…&epk=…&box=…, then signs the browser out. Only
  the app that opened the page can open the box: the link itself is useless
  to whoever sees it (the process list, the browser's history, another app
  that registered the scheme). The app accepts only the state it generated.

  The box: ECDH P-256 between the app's key and a fresh key of this page
  (epk, the raw uncompressed point), HKDF-SHA256 (no salt, info
  "lovearound signin v1") → AES-256-GCM key, the state as associated data;
  box = 12-byte nonce + ciphertext + tag. Base64url without padding.

  Builds older than the key open the page without key=; they know only the
  codename's scheme, so they get needed://signin?state=…&uid=…&email=…&rt=…
  in the clear, as before. Drop that branch once those builds have updated.

  The Telegram bot opens /signin?telegram=1, with nothing about the chat: this
  page gets a one-time link from the server with the Firebase ID token and
  goes there, and whichever Telegram opens it joins this account. Nothing
  comes from the chat, so a link from someone else's can't sign a stranger's
  account in to it.

  One touch: Apple or Google with an email that already has an account made
  another way is refused (one account per email). The page then asks for the
  old way, offering every way but the refused one, and adds the refused way
  to the account right after (`pending`, memory only). When that is lost (a
  reload, another tab), a mark in localStorage, the way's name alone, makes
  the done screen say where to add it by hand.
-->
<div class="page">
<header class="top"><div class="wrap"><a class="logo" href="/"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.3-9C1.4 8.6 3.6 5 7.2 5c2.1 0 3.5 1.1 4.8 2.9C13.3 6.1 14.7 5 16.8 5c3.6 0 5.8 3.6 4.5 7-1.8 4.4-9.3 9-9.3 9z"/></svg>lovearound</a></div></header>
<main>
  <div class="card">
    <div class="badge"><svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.3-9C1.4 8.6 3.6 5 7.2 5c2.1 0 3.5 1.1 4.8 2.9C13.3 6.1 14.7 5 16.8 5c3.6 0 5.8 3.6 4.5 7-1.8 4.4-9.3 9-9.3 9z"/></svg></div>
    <h1 id="title" data-t="heading"></h1>
    <p class="lead" id="text" data-t="text"></p>
    <div class="choices" id="choices">
      <button class="btn apple" id="apple" type="button"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M16.37 12.6c-.02-2.3 1.88-3.4 1.96-3.46-1.07-1.56-2.73-1.78-3.32-1.8-1.41-.14-2.76.83-3.47.83-.72 0-1.82-.81-2.99-.79-1.54.02-2.96.9-3.75 2.27-1.6 2.78-.41 6.88 1.15 9.13.76 1.1 1.67 2.33 2.86 2.29 1.15-.05 1.58-.74 2.97-.74 1.38 0 1.78.74 2.99.72 1.24-.02 2.02-1.12 2.77-2.22.87-1.28 1.23-2.52 1.25-2.58-.03-.01-2.4-.92-2.42-3.65zM14.1 5.86c.63-.77 1.06-1.83.94-2.89-.91.04-2.02.61-2.67 1.37-.58.67-1.1 1.76-.96 2.8 1.02.08 2.06-.52 2.69-1.28z"/></svg><span data-t="apple_button"></span></button>
      <button class="btn white" id="go" type="button"><svg aria-hidden="true" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg><span data-t="button"></span></button>
      <button class="btn white" id="mail" type="button"><svg class="line" aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M3.8 7l8.2 6 8.2-6"/></svg><span data-t="email_button"></span></button>
      <button class="all-ways" id="all" type="button" data-t="all_ways" hidden></button>
    </div>
    <form class="signin-form" id="form" novalidate hidden>
      <label><span data-t="email"></span><input id="email" type="email" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false"></label>
      <label><span data-t="password"></span><input id="password" type="password" autocomplete="current-password"></label>
      <button class="btn" id="submit" type="submit" data-t="submit"></button>
      <div class="links"><button type="button" id="formback" data-t="form_back"></button><button type="button" id="forgot" data-t="forgot"></button></div>
    </form>
    <p class="form-msg" id="note" role="status" hidden></p>
    <a class="btn" id="back" href="#" data-t="back" hidden></a>
    <p class="way-hint" id="hint" hidden><span id="hinttext"></span> <a href="https://app.lovearound.me/#/settings/signin" data-t="add_link"></a></p>
  </div>
</main>
<footer>
  <div class="wrap">
    <span class="motto">SPREAD LOVE. FEEL CONNECTED.</span>
    <span><a href="https://github.com/lovearound-me">GitHub</a> · <a href="https://t.me/lovearound_help">Telegram</a> · © 2026 lovearound</span>
  </div>
</footer>
</div>
<script src="/lang.js"></script>
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
  import { getAuth, GoogleAuthProvider, OAuthProvider, signInWithPopup, signOut, inMemoryPersistence, setPersistence,
    signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, linkWithCredential }
    from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

  const app = initializeApp({
    apiKey: 'AIzaSyBZJfln_KXsxRxo3fvVaV1ePmiVUIn5YXY',
    // Sign in through the page's own host (Firebase Hosting serves /__/auth
    // there): Google then says "continue to lovearound.me", and browsers that
    // partition storage keep the sign-in state.
    authDomain: ['lovearound.me', 'www.lovearound.me'].includes(location.hostname)
      ? location.hostname : 'needed-app-2026.firebaseapp.com',
    projectId: 'needed-app-2026',
  });
  const auth = getAuth(app);
  const params = new URLSearchParams(location.search);
  const state = params.get('state') || '';
  const key = params.get('key') || '';
  const $ = (id) => document.getElementById(id);
  const T = lovearoundLang.apply({{@strings}});
  const telegram = params.get('telegram') === '1';

  const b64url = (bytes) => btoa(String.fromCharCode(...new Uint8Array(bytes)))
    .replaceAll('+', '-').replaceAll('/', '_').replace(/=+$/, '');
  const unb64url = (text) => Uint8Array.from(
    atob(text.replaceAll('-', '+').replaceAll('_', '/')), (c) => c.charCodeAt(0));

  // The session sealed to the app's key: see the comment at the top.
  async function seal(session) {
    const ecdh = { name: 'ECDH', namedCurve: 'P-256' };
    const theirs = await crypto.subtle.importKey('raw', unb64url(key), ecdh, false, []);
    const mine = await crypto.subtle.generateKey(ecdh, true, ['deriveBits']);
    const shared = await crypto.subtle.deriveBits({ name: 'ECDH', public: theirs }, mine.privateKey, 256);
    const hkdf = await crypto.subtle.importKey('raw', shared, 'HKDF', false, ['deriveKey']);
    const aes = await crypto.subtle.deriveKey(
      { name: 'HKDF', hash: 'SHA-256', salt: new Uint8Array(0), info: new TextEncoder().encode('lovearound signin v1') },
      hkdf, { name: 'AES-GCM', length: 256 }, false, ['encrypt']);
    const nonce = crypto.getRandomValues(new Uint8Array(12));
    const sealed = await crypto.subtle.encrypt(
      { name: 'AES-GCM', iv: nonce, additionalData: new TextEncoder().encode(state) },
      aes, new TextEncoder().encode(JSON.stringify(session)));
    const box = new Uint8Array(12 + sealed.byteLength);
    box.set(nonce);
    box.set(new Uint8Array(sealed), 12);
    return { epk: b64url(await crypto.subtle.exportKey('raw', mine.publicKey)), box: b64url(box) };
  }

  // Where a sign-in for the Telegram bot goes next: see the comment at the top.
  async function telegramLink(user) {
    const resp = await fetch('https://api.lovearound.me/v1/telegram/link', {
      method: 'POST',
      headers: { authorization: 'Bearer ' + await user.getIdToken() },
    });
    if (!resp.ok) throw new Error('telegram link: ' + resp.status);
    return (await resp.json()).url;
  }

  if (telegram) {
    // The bot has no accounts of its own: a new person makes one here, with
    // Apple, Google or an email and a password, as in the web app.
    $('title').textContent = T.hello;
    $('text').textContent = T.telegram_text;
    $('back').textContent = T.telegram_back;
  } else if (!/^[A-Za-z0-9-]{8,64}$/.test(state) || (key && !/^[A-Za-z0-9_-]{87}$/.test(key))) {
    $('title').textContent = T.from_app;
    $('text').textContent = T.from_app_text;
    $('choices').hidden = true;
  }
  $('password').placeholder = T.password_hint;

  // Signed in: hand the session over (see the comment at the top).
  async function finish(user) {
    const missed = await addPending(user);
    const session = { uid: user.uid, email: user.email || '', rt: user.refreshToken };
    const back = telegram
      ? await telegramLink(user)
      : key
      ? 'lovearound://signin?' + new URLSearchParams({ state, ...await seal(session) })
      : 'needed://signin?' + new URLSearchParams({ state, ...session });
    await signOut(auth);
    $('title').textContent = T.done;
    $('text').textContent = telegram ? T.telegram_done : T.done_text;
    $('text').hidden = false;
    $('choices').hidden = $('form').hidden = $('note').hidden = true;
    $('back').href = back;
    $('back').hidden = false;
    if (missed) {
      $('hinttext').textContent = T.add_hint.replace('{way}', WAYS[missed].name);
      $('hint').hidden = false;
    }
    location.href = back;
  }

  // ---- one touch (see the comment at the top) ----
  const WAYS = {
    apple: { name: 'Apple', id: 'apple.com', button: 'apple', from: (e) => OAuthProvider.credentialFromError(e) },
    google: { name: 'Google', id: 'google.com', button: 'go', from: (e) => GoogleAuthProvider.credentialFromError(e) },
  };
  const MARK = 'lovearound.addWay', MARK_FOR = 24 * 3600 * 1000;
  let pending = null; // { kind, credential, email }
  const mark = (kind) => {
    try { kind ? localStorage.setItem(MARK, JSON.stringify({ kind, at: Date.now() })) : localStorage.removeItem(MARK); } catch (e) {}
  };
  const marked = () => {
    try {
      const m = JSON.parse(localStorage.getItem(MARK) || 'null');
      return m && WAYS[m.kind] && Date.now() - m.at < MARK_FOR ? m.kind : null;
    } catch (e) { return null; }
  };

  // Refused for an account made another way: ask for the old way.
  function refused(kind, e) {
    const credential = WAYS[kind].from(e);
    if (!credential) return false;
    pending = { kind, credential, email: (e.customData && e.customData.email) || '' };
    mark(kind);
    $('title').textContent = T.exists_title;
    $('text').textContent = T.exists_text.replace('{way}', WAYS[kind].name);
    for (const k in WAYS) $(WAYS[k].button).hidden = k === kind;
    $('all').hidden = false;
    if (pending.email && !$('email').value) $('email').value = pending.email;
    return true;
  }
  $('all').addEventListener('click', () => {
    pending = null;
    mark(null);
    for (const k in WAYS) $(WAYS[k].button).hidden = false;
    $('all').hidden = true;
    $('title').textContent = telegram ? T.hello : T.heading;
    $('text').textContent = telegram ? T.telegram_text : T.text;
  });

  // Signed in the old way: the refused way joins the account, if it is the
  // one with that email. The way still to add by hand, or null.
  async function addPending(user) {
    const own = (u) => [u.email, ...u.providerData.map((p) => p.email)].filter(Boolean).map((a) => a.toLowerCase());
    if (pending) {
      const { kind, credential, email } = pending;
      pending = null;
      if (email && !own(user).includes(email.toLowerCase())) { mark(null); return null; }
      try {
        await linkWithCredential(user, credential);
        mark(null);
        return null;
      } catch (e) {
        return kind;
      }
    }
    const kind = marked();
    mark(null);
    return kind && !user.providerData.some((p) => p.providerId === WAYS[kind].id) ? kind : null;
  }

  // The browser keeps nothing: the session goes to the app only.
  const ready = setPersistence(auth, inMemoryPersistence);

  // Apple and Google, in a popup. One account per email: when the email
  // already has an account made another way, Firebase refuses and the person
  // signs in the way they did before.
  async function withPopup(button, provider) {
    const buttons = $('choices').querySelectorAll('button');
    buttons.forEach((b) => { b.disabled = true; });
    try {
      await ready;
      const { user } = await signInWithPopup(auth, provider);
      await finish(user);
    } catch (e) {
      buttons.forEach((b) => { b.disabled = false; });
      const code = e && e.code;
      if (code === 'auth/account-exists-with-different-credential' && refused(button === $('apple') ? 'apple' : 'google', e)) return;
      $('text').textContent = code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request'
        ? T.closed
        : code === 'auth/account-exists-with-different-credential'
        ? T.exists
        : T.failed;
    }
  }
  // Always Google's account chooser, as in the web app: with a second Google
  // account signed in to the browser, it would otherwise go straight in with
  // whichever Google used last and quietly make a new, empty account.
  $('go').addEventListener('click', () => {
    const google = new GoogleAuthProvider();
    google.setCustomParameters({ prompt: 'select_account' });
    withPopup($('go'), google);
  });
  $('apple').addEventListener('click', () => {
    const apple = new OAuthProvider('apple.com');
    apple.addScope('email');
    apple.setCustomParameters({ locale: document.documentElement.lang });
    withPopup($('apple'), apple);
  });

  // Email and password. As in the web app: sign in, or make the account if
  // this email has none.
  const note = (text) => { $('note').textContent = text || ''; $('note').hidden = !text; };
  const showForm = (on) => {
    $('choices').hidden = on;
    $('form').hidden = !on;
    $('text').hidden = on;
    note('');
    if (on) $('email').focus();
  };
  function authText(e) {
    switch (String(e && e.code || '').replace(/^auth\//, '')) {
      case 'wrong-password': case 'invalid-credential': case 'invalid-login-credentials': return T.wrong_password;
      case 'weak-password': return T.weak_password;
      case 'invalid-email': case 'missing-email': return T.bad_email;
      case 'missing-password': return T.need_password;
      case 'too-many-requests': return T.too_many;
      case 'user-disabled': return T.disabled;
      case 'network-request-failed': return T.offline;
      default: return T.failed;
    }
  }
  async function withEmail(email, password) {
    try {
      return (await signInWithEmailAndPassword(auth, email, password)).user;
    } catch (e) {
      // With email enumeration protection on, a wrong password and a missing
      // account look the same: try to make it.
      if (!['auth/user-not-found', 'auth/invalid-credential', 'auth/invalid-login-credentials'].includes(e.code)) throw e;
      try {
        return (await createUserWithEmailAndPassword(auth, email, password)).user;
      } catch (made) {
        // The account is there, so it was the password.
        throw made.code === 'auth/email-already-in-use' ? Object.assign(new Error(), { code: 'auth/wrong-password' }) : made;
      }
    }
  }

  $('mail').addEventListener('click', () => showForm(true));
  $('formback').addEventListener('click', () => showForm(false));
  $('form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const email = $('email').value.trim(), password = $('password').value;
    if (!email) return note(T.need_email);
    if (!email.includes('@')) return note(T.bad_email);
    if (password.length < 8) return note(T.short_password);
    note('');
    $('submit').disabled = true;
    $('submit').textContent = T.busy;
    try {
      await ready;
      await finish(await withEmail(email, password));
    } catch (e) {
      note(authText(e));
    } finally {
      $('submit').disabled = false;
      $('submit').textContent = T.submit;
    }
  });
  $('forgot').addEventListener('click', async () => {
    const email = $('email').value.trim();
    if (!email) return note(T.reset_first);
    try {
      await sendPasswordResetEmail(auth, email);
      note(T.reset_sent);
    } catch (e) {
      note(authText(e));
    }
  });
</script>
</body>
</html>
