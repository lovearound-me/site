        <div class="pf-scenes" id="pf-scenes">
          <div class="pf-sender" id="pf-sender" role="img" aria-label="{{platform.sender_alt}}">

                <div class="pf-row"><i style="background:#F3D9C8"></i><span>{{platform.third}}</span><em class="pf-hb"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.2 0 3.6 1.2 5.2 3 1.6-1.8 3-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg></em></div>
              </div></div>

          </div>

        <div class="pf-controls">
          <div class="pf-toggles" role="group" aria-label="{{platform.devices_label}}">
            <button class="pf-tg" type="button" id="pf-tg-lap" data-dev="lap" aria-pressed="true"><span class="sw"></span>{{platform.laptop}}</button>
            <button class="pf-tg" type="button" id="pf-tg-heart" data-dev="heart" aria-pressed="true"><span class="sw"></span>Heart</button>
            <button class="pf-tg" type="button" id="pf-tg-lamp" data-dev="lamp" aria-pressed="true"><span class="sw"></span>{{platform.lamp}}</button>
            <button class="pf-tg" type="button" id="pf-tg-pend" data-dev="pend" aria-pressed="false"><span class="sw"></span>{{platform.pendant}}</button>
          </div>
          <p class="pf-hint">{{platform.hint}}</p>
        </div>
        <p class="pf-status" id="pf-status" data-press="{{platform.st_press}}" data-fly="{{platform.st_fly}}" data-done="{{platform.st_done}}" data-none="{{platform.st_none}}">{{platform.st_done}}</p>
